<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UniverseGenome — Phase 3</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; background: #111827; color: #e5e7eb; }
    button, select { padding: .35rem .55rem; }
    .overview { display: grid; grid-template-columns: repeat(16, minmax(2.2rem, 1fr)); gap: .2rem; max-width: 72rem; }
    .thumbnail { aspect-ratio: 1; border: 1px solid #4b5563; background: #1f2937; color: #d1d5db; font-size: .7rem; cursor: pointer; }
    .thumbnail[data-category="masked_xor"] { border-color: #60a5fa; }
    .thumbnail[data-category="rotate_copy"] { border-color: #34d399; }
    .thumbnail[data-category="masked_and"] { border-color: #fbbf24; }
    canvas { border: 1px solid #6b7280; image-rendering: pixelated; width: min(512px, 90vw); height: auto; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    .status { max-width: 60rem; }
  </style>
</head>
<body>
  <h1>UniverseGenome — Phase 3</h1>
  <p>128-universe observation surface: 16×8 overview, independent detail inspection, and bounded controls.</p>
  <section aria-label="Universe overview">
    <div id="overview" class="overview" data-layout="16x8"></div>
  </section>
  <section aria-label="Observation detail">
    <h2 id="selected-label">Universe 0</h2>
    <canvas id="universe" width="512" height="512" aria-label="Selected universe detail"></canvas>
    <label>Mode
      <select id="mode">
        <option>HP</option><option>hierarchy</option><option>latent bit</option><option>activity</option><option>bond/contact</option>
      </select>
    </label>
  </section>
  <div class="controls" aria-label="Simulation controls">
    <button data-action="run">Run</button>
    <button data-action="pause">Pause</button>
    <button data-action="step">1 Step</button>
    <button data-action="reset">Reset</button>
    <button data-action="select">Select Universe</button>
    <button data-action="clone">Clone for Observation</button>
    <label>Rewind
      <select data-action="rewind">
        <option value="128">128</option><option value="256">256</option><option value="512">512</option>
      </select>
    </label>
    <button data-action="save">Save Snapshot</button>
    <button data-action="load">Load Snapshot</button>
  </div>
  <p id="status" class="status"></p>
  <script type="module" src="./sim_view.js"></script>
  <script type="module" src="./controls.js"></script>
</body>
</html>
