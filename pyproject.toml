[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universegenome"
version = "0.0.0"
description = "UniverseGenome deterministic local-physics research project"
requires-python = ">=3.11"

[project.scripts]
universegenome = "core.runner:main"

[tool.setuptools]
packages = ["core", "search", "persistence", "server"]
