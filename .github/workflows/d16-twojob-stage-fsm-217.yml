name: D16 Dormant Exact Native Two-Job Stage FSM

on:
  pull_request:
    paths:
      - "research/d16_twojob_stage_fsm_217.py"
      - "tests/test_d16_twojob_stage_fsm_217.py"
      - ".github/workflows/d16-twojob-stage-fsm-217.yml"

permissions:
  contents: read

jobs:
  original_metadata_only_no_study:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source-native structural metadata-only two-job stage tests
        run: |
          python -m py_compile research/d16_twojob_stage_fsm_217.py
          timeout -k 10s 260s python -m unittest tests.test_d16_twojob_stage_fsm_217 -v
