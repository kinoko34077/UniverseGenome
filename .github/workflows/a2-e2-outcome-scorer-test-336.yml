name: A2 E2 pre-outcome scorer static tests #336

on:
  pull_request:
    paths:
      - "research/a2_e2_outcome_scoring_336.py"
      - "tests/test_a2_e2_outcome_scoring_336.py"
      - ".github/workflows/a2-e2-outcome-scorer-test-336.yml"

permissions:
  contents: read

jobs:
  pure_static_scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "pypy3.11"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pure report classification with synthetic dictionaries; NO seeds
        run: |
          python -m unittest tests.test_a2_e2_outcome_scoring_336 -v
