name: A1.6 fusion gate funnel source-only #326

on:
  pull_request:
    paths:
      - "research/a16_fusion_eligibility_funnel_326.py"
      - "tests/test_a16_fusion_eligibility_funnel_326.py"
      - "research/designs/a16_fusion_gate_funnel_326.md"
      - ".github/workflows/a16-fusion-gate-funnel-326.yml"

permissions:
  contents: read

jobs:
  native_source_funnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert runtime and exact native gate fixture
        run: |
          python - <<'PY'
          import sys
          expected = "pypy" if "${{ matrix.python }}".startswith("pypy") else "cpython"
          assert sys.implementation.name == expected
          print(sys.version)
          PY
          python -m compileall -q research/a16_fusion_eligibility_funnel_326.py tests/test_a16_fusion_eligibility_funnel_326.py
          python -m unittest tests.test_a16_native_latent_diversity_feasibility_326 tests.test_a16_fusion_eligibility_funnel_326 -v
