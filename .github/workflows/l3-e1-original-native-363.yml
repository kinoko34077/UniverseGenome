name: L3 E1 #363 genuine original selected precontact — one reviewed marker

on:
  push:
    branches: [main]
    paths:
      - "research/approvals/l3_e1_original_native_363.run"

permissions:
  contents: read

concurrency:
  group: l3-e1-original-one-shot-363
  cancel-in-progress: false

jobs:
  genuine_original_context_controlled_e1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify one new marker and original native source-only control gates
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "research/approvals/l3_e1_original_native_363.run"
          test "$(git log --full-history --format=%H --diff-filter=A HEAD -- research/approvals/l3_e1_original_native_363.run | wc -l)" -eq 1
          test "$(git log --full-history --format=%H --diff-filter=M HEAD -- research/approvals/l3_e1_original_native_363.run | wc -l)" -eq 0
          test "$(git log --full-history --format=%H --diff-filter=D HEAD -- research/approvals/l3_e1_original_native_363.run | wc -l)" -eq 0
          python -m unittest tests.test_l3_e1_precontact_protocol_363 tests.test_l3_e1_native_source_363 -v
      - name: Source-locked genuine 544 selected pre-step and local trace-only E1 (once)
        shell: bash
        id: original_e1
        env:
          EXACT_SOURCE_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p research/artifacts
          timeout --signal=TERM --kill-after=10s 900s python -m tests.l3_e1_native_intervention_363 \
            --source-sha "$EXACT_SOURCE_SHA" --execute \
            --output research/artifacts/l3_e1_original_native_363.json
          sha256sum research/artifacts/l3_e1_original_native_363.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/artifacts/l3_e1_original_native_363.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="UG_L3_363_E1_AUTHENTIC_PRECONTACT_INTERVENTION_V1"
          assert r["owner"]==363
          assert r["original_e0_raw_sha256"]=="08b1368a74729dfa5bee6da29069a7d757cc053fd5de493777e701196aa1368d"
          assert r["independent_confirmation"] is False
          assert r["learning_claim"] is False
          assert r["classification"] in {
              "LOCAL_AUTHENTIC_CONTEXT_CONTROLLED_RECEIVER_EFFECT_RETENTION_UNRESOLVED",
              "NOT_EVALUABLE_NO_QUALIFIED_ORIGINAL_H0_CONTACT",
              "NEGATIVE_TRACE_READER_MASK_NOT_REACHED",
              "NEGATIVE_MASK_CHANGE_WITHOUT_SOURCE_BIT",
              "NEGATIVE_NO_REAL_RECIPIENT_EFFECT",
          }
          assert p.stat().st_size<=131072
          if "local_intervention" in r:
              loc=r["local_intervention"]
              assert loc["baseline_original_event_verified"]
              assert loc["all_native_observer_parities"]
              assert loc["same_value_sham_full_state_parity"]
              assert loc["zero_source_bit_pair_negative"]
          print("L3_E1_363_NATIVE_RESULT:",r["classification"])
          PY
          # Preserve exact original bytes in Actions logs for durable Git archival.
          echo "L3_E1_363_RAW_B64_BEGIN"
          base64 -w0 research/artifacts/l3_e1_original_native_363.json
          echo
          echo "L3_E1_363_RAW_B64_END"
      - name: Keep bounded original source-native E1 witness for verified archival
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l3-e1-363-original-native-precontact-witness
          path: research/artifacts/l3_e1_original_native_363.json
          if-no-files-found: error
          retention-days: 5
