name: D1 Slow Trace Acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  d1_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation head
        uses: actions/checkout@v4
        with:
          path: current
      - name: Checkout accepted pre-D1 baseline
        uses: actions/checkout@v4
        with:
          ref: 735e915a9672ef955f1ab0487bfc5b61311d9be6
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared acceptance harness into baseline tree
        run: cp current/benchmarks/slow_trace_acceptance.py baseline/benchmarks/slow_trace_acceptance.py
      - name: Compare 64 inert trajectories over 1024 generations
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && python benchmarks/slow_trace_acceptance.py fingerprint --generations 1024) > baseline-fingerprint.json
          (cd current && python benchmarks/slow_trace_acceptance.py fingerprint --generations 1024) > current-fingerprint.json
          echo "D1_BASELINE_FINGERPRINT=$(cat baseline-fingerprint.json)"
          echo "D1_CURRENT_FINGERPRINT=$(cat current-fingerprint.json)"
          python - <<'PY'
          import json
          baseline = json.load(open("baseline-fingerprint.json", encoding="utf-8"))
          current = json.load(open("current-fingerprint.json", encoding="utf-8"))
          for key in ("generations", "seed_range", "preexisting_arrays", "density4", "density32"):
              if baseline[key] != current[key]:
                  raise SystemExit(f"inert compatibility mismatch for {key}: {baseline[key]!r} != {current[key]!r}")
          print("D1_INERT_COMPATIBILITY=PASS")
          PY
      - name: Measure TEST-ST-010 baseline overhead
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && python benchmarks/slow_trace_acceptance.py measure --generations 512 --warmup 32 --repeats 3) > baseline-measure.json
          (cd current && python benchmarks/slow_trace_acceptance.py measure --generations 512 --warmup 32 --repeats 3) > current-measure.json
          echo "D1_BASELINE_MEASURE=$(cat baseline-measure.json)"
          echo "D1_CURRENT_MEASURE=$(cat current-measure.json)"
          python - <<'PY'
          import json
          baseline = json.load(open("baseline-measure.json", encoding="utf-8"))
          current = json.load(open("current-measure.json", encoding="utf-8"))
          for density in ("density4", "density32"):
              old = baseline["throughput"][density]["median_generations_per_second"]
              new = current["throughput"][density]["median_generations_per_second"]
              delta = ((new / old) - 1.0) * 100.0
              print(f"D1_THROUGHPUT_{density.upper()}_BASELINE={old:.6f}")
              print(f"D1_THROUGHPUT_{density.upper()}_CURRENT={new:.6f}")
              print(f"D1_THROUGHPUT_{density.upper()}_DELTA_PERCENT={delta:.3f}")
          for key in ("density4_universe", "density32_universe", "optimizer_128_slots"):
              old = baseline["snapshot_bytes"][key]
              new = current["snapshot_bytes"][key]
              delta = new - old
              percent = (delta / old * 100.0) if old else 0.0
              print(f"D1_SNAPSHOT_{key.upper()}_BASELINE={old}")
              print(f"D1_SNAPSHOT_{key.upper()}_CURRENT={new}")
              print(f"D1_SNAPSHOT_{key.upper()}_DELTA_BYTES={delta}")
              print(f"D1_SNAPSHOT_{key.upper()}_DELTA_PERCENT={percent:.3f}")
          trace = current["trace"]
          print(f"D1_TRACE_STORAGE_TYPE={trace['storage_type']}")
          print(f"D1_TRACE_RAW_BYTES_PER_UNIVERSE={trace['raw_bytes_per_universe']}")
          print(f"D1_TRACE_RAW_BYTES_128={trace['raw_bytes_across_128_slots']}")
          print(f"D1_TRACE_PYTHON_CONTAINER_BYTES_PER_UNIVERSE={trace['python_container_bytes_per_universe']}")
          PY
