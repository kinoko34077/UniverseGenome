name: A2 original rotate_copy runner non-execution gate #336

on:
  pull_request:
    paths:
      - "research/a2_locked_rotate_copy_pilot_336.py"
      - "tests/test_a2_locked_rotate_copy_pilot_336.py"
      - "research/designs/a2_locked_rotate_copy_pilot_336.md"
      - ".github/workflows/a2-locked-original-runner-336.yml"

permissions:
  contents: read

jobs:
  frozen_no_execute_check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Only confirm refusal without qualifying original seeds
        run: |
          python - <<'PY'
          import sys
          expected="pypy" if "${{ matrix.python }}".startswith("pypy") else "cpython"
          assert sys.implementation.name==expected
          print(sys.version)
          PY
          python -m compileall -q research/a2_locked_rotate_copy_pilot_336.py tests/test_a2_locked_rotate_copy_pilot_336.py
          python -m unittest tests.test_a2_protocol_preflight_334 tests.test_a2_locked_rotate_copy_pilot_336 -v
