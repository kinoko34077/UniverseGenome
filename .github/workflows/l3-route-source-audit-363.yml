name: L3 E0 #363 source-only stage contract (NO native seed experiment)

on:
  pull_request:
    paths:
      - "tests/support_l3_native_route_363.py"
      - "tests/test_l3_native_route_363.py"
      - "tests/l3_native_route_pilot_363.py"
      - "tests/l3_native_route_protocol_363.json"
      - "tests/test_l3_route_preflight_363.py"
      - "tests/test_l3_trace_only_physical_read_363.py"
      - "tests/support_l3_e1_precontact_363.py"
      - "tests/l3_e1_precontact_protocol_363.json"
      - "tests/test_l3_e1_precontact_protocol_363.py"
      - "tests/l3_e1_native_intervention_363.py"
      - "tests/test_l3_e1_native_source_363.py"
      - "tests/support_l3_e2_retention_379.py"
      - "tests/l3_e2_retention_protocol_379.json"
      - "tests/test_l3_e2_retention_protocol_379.py"
      - "tests/l3_e2_original_native_381.py"
      - "tests/test_l3_e2_native_source_381.py"
      - "research/outer_l3_search_protocol_386.json"
      - "research/outer_l3_memory_search_386.py"
      - "tests/test_outer_l3_memory_search_386.py"
      - "research/outer_l3_inner_adapter_388.py"
      - "tests/test_outer_l3_inner_adapter_388.py"
      - "research/outer_l3_native_evidence_388.py"
      - "tests/test_outer_l3_native_evidence_388.py"
      - ".github/a2-e2-reviewed-code-lock-336.json"
      - "tests/test_a2_e2_blob_lock_336.py"
      - ".github/workflows/l3-route-source-audit-363.yml"
      - ".github/workflows/l3-route-e0-one-shot-363.yml"

permissions:
  contents: read

jobs:
  strict_synthetic_and_original_raw_provenance:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "pypy3.11"]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pure synthetic native-stage rules and original log-derived bytes ONLY
        run: |
          python -m unittest tests.test_l3_native_route_363 tests.test_l3_route_preflight_363 tests.test_l3_trace_only_physical_read_363 tests.test_l3_e1_precontact_protocol_363 tests.test_l3_e1_native_source_363 tests.test_l3_e2_retention_protocol_379 tests.test_l3_e2_native_source_381 tests.test_outer_l3_memory_search_386 tests.test_outer_l3_inner_adapter_388 tests.test_outer_l3_native_evidence_388 tests.test_a2_e2_blob_lock_336 -v
