name: A2 native recipient static contract #336

on:
  pull_request:
    paths:
      - "research/a2_matched_recipient_contract_336.py"
      - "tests/test_a2_matched_recipient_contract_336.py"
      - "research/designs/a2_native_recipient_event_contract_336.md"
      - ".github/workflows/a2-native-recipient-contract-336.yml"

permissions:
  contents: read

jobs:
  nonexecuting_native_witness_schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check interpreter, source-only synthetic native event contract
        run: |
          python - <<'PY'
          import sys
          wanted = "pypy" if "${{ matrix.python }}".startswith("pypy") else "cpython"
          assert sys.implementation.name == wanted
          print(sys.version)
          PY
          python -m compileall -q research/a2_matched_recipient_contract_336.py tests/test_a2_matched_recipient_contract_336.py
          python -m unittest tests.test_a2_matched_recipient_contract_336 -v
