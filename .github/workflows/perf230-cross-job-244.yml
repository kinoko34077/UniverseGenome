name: PERF230 P4.4 Original Native128 Across Jobs v7 Continuation

on:
  pull_request:
    paths:
      - "benchmarks/perf230_cross_job_handoff_244.py"
      - "tests/test_perf230_cross_job_handoff_244.py"
      - ".github/workflows/perf230-cross-job-244.yml"

permissions:
  contents: read

jobs:
  selected_round_1:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transfer trust boundary unit checks
        run: python -m unittest tests.test_perf230_cross_job_handoff_244
      - name: Genuine original seed0 default1024 native128 selected round 1
        run: |
          mkdir -p reports/perf230-p44/transfer
          timeout -k 20s 900s python -m benchmarks.perf230_cross_job_handoff_244 --stage first --out reports/perf230-p44/transfer
      - name: Upload immutable completed v7 only after full accepted selected round
        uses: actions/upload-artifact@v4
        with:
          name: perf230-p44-original-selected-round1
          path: reports/perf230-p44/transfer/
          if-no-files-found: error
          retention-days: 7

  selected_round_2:
    needs: selected_round_1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: perf230-p44-original-selected-round1
          path: reports/perf230-p44/inbound/
      - name: Validate authentic selected v7 transfer, resume original next selection
        run: |
          mkdir -p reports/perf230-p44/results
          timeout -k 20s 900s python -m benchmarks.perf230_cross_job_handoff_244 --stage second --inbound reports/perf230-p44/inbound --out reports/perf230-p44/results
      - name: Archive source-bound continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf230-p44-original-native128-two-jobs-verdict
          path: reports/perf230-p44/results/
          if-no-files-found: warn
          retention-days: 7
