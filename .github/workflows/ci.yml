name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  phase5_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall core search persistence server tests
      - name: Unit smoke tests
        run: python -m unittest discover -s tests -v
      - name: Headless Phase 5 smoke
        run: python -m core.runner --config config/default.json --json
      - name: Headless Phase 5 optimizer CLI smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --optimizer-timeout-generations 8
          --json
      - name: Headless Phase 6.1 multi-mapping experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_multi_mapping_smoke.json
          --json
      - name: Headless Phase 6.2 temporal sequence experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_temporal_sequence_smoke.json
          --json
      - name: Headless Phase 6.2 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_temporal_sequence_smoke.json
          --optimizer-timeout-generations 2
          --json
      - name: Headless Phase 6.3 multi-event timing experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_multi_event_timing_smoke.json
          --json
      - name: Headless Phase 6.3 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_multi_event_timing_smoke.json
          --optimizer-timeout-generations 2
          --json
      - name: Headless Phase 6.4 forgetting/relearning experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_forgetting_relearning_smoke.json
          --json
      - name: Headless Phase 6.4 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_forgetting_relearning_smoke.json
          --optimizer-timeout-generations 1
          --json
      - name: Static server entrypoint smoke
        run: python -m server.app --help

  browser_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npx playwright test
