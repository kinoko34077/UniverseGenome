name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  phase5_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall core search persistence server tests
      - name: Unit smoke tests
        run: python -m unittest discover -s tests -v
      - name: Headless Phase 5 smoke
        run: python -m core.runner --config config/default.json --json
      - name: Headless Phase 5 optimizer CLI smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --optimizer-timeout-generations 8
          --json
      - name: Headless Phase 6.1 multi-mapping experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_multi_mapping_smoke.json
          --json
      - name: Headless Phase 6.2 temporal sequence experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_temporal_sequence_smoke.json
          --json
      - name: Headless Phase 6.2 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_temporal_sequence_smoke.json
          --optimizer-timeout-generations 2
          --json
      - name: Headless Phase 6.3 multi-event timing experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_multi_event_timing_smoke.json
          --json
      - name: Headless Phase 6.3 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_multi_event_timing_smoke.json
          --optimizer-timeout-generations 2
          --json
      - name: Headless Phase 6.4 forgetting/relearning experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_forgetting_relearning_smoke.json
          --json
      - name: Headless Phase 6.4 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_forgetting_relearning_smoke.json
          --optimizer-timeout-generations 1
          --json
      - name: Headless Phase 6.5 noise robustness experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_noise_robustness_smoke.json
          --json
      - name: Headless Phase 6.5 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_noise_robustness_smoke.json
          --optimizer-timeout-generations 1
          --json
      - name: Headless Phase 6.6 generalization experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_generalization_smoke.json
          --json
      - name: Headless Phase 6.6 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_generalization_smoke.json
          --optimizer-timeout-generations 1
          --json
      - name: Headless Phase 6.7 multi-byte sequence experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_multi_byte_sequences_smoke.json
          --json
      - name: Headless Phase 6.7 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_multi_byte_sequences_smoke.json
          --optimizer-timeout-generations 1
          --json
      - name: Headless Phase 6.8 raw UTF-8 byte experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_raw_utf8_smoke.json
          --json
      - name: Headless Phase 6.8 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_raw_utf8_smoke.json
          --optimizer-timeout-generations 1
          --json
      - name: Headless Phase 6.9 mixed-length sequence experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_mixed_length_sequences_smoke.json
          --json
      - name: Headless Phase 6.9 optimizer integration smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --experiment-config config/experiment_phase6_mixed_length_sequences_smoke.json
          --optimizer-timeout-generations 1
          --json
      - name: Static server entrypoint smoke
        run: python -m server.app --help

  browser_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npx playwright test

  pypy_compatibility:
    # Non-default, test-only compatibility proof for new runtimes. Never
    # replays a D16/D18 research seed or the P7.3 native37 study.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"
      - name: Attest real PyPy 3.11
        run: |
          python - <<'PY'
          import json
          import sys
          identity = {
              "implementation": sys.implementation.name,
              "version": list(sys.version_info[:2]),
              "executable": sys.executable,
          }
          print(json.dumps(identity, sort_keys=True))
          assert identity["implementation"] == "pypy"
          assert identity["version"] == [3, 11]
          PY
      - name: Compile all current Python runtime paths
        run: python -m compileall core search persistence server tests
      - name: Full PyPy existing unittest suite
        run: python -m unittest discover -s tests -v
      # Diagnostic only after genuine full-suite failure. These must never
      # suppress or replace the original full-suite/1536MiB admission failure.
      - name: Diagnose fresh PyPy D15 serial actual tests
        if: ${{ failure() }}
        continue-on-error: true
        run: python -m unittest discover -s tests -p test_d15_selected_resume_213.py -v
      - name: Diagnose fresh PyPy D15 spawn actual tests
        if: ${{ failure() }}
        continue-on-error: true
        run: python -m unittest discover -s tests -p test_d15_spawn_workers_226.py -v
      - name: PyPy headless Inner smoke
        run: python -m core.runner --config config/default.json --json
      - name: PyPy headless Outer optimizer smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --optimizer
          --optimizer-iterations 0
          --optimizer-timeout-generations 8
          --json
      - name: PyPy Phase 6.2 temporal experiment smoke
        run: >-
          python -m core.runner
          --config config/default.json
          --experiment
          --experiment-config config/experiment_phase6_temporal_sequence_smoke.json
          --json
      - name: PyPy server entrypoint smoke
        run: python -m server.app --help
