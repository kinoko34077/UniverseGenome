name: A2 E2 marker-only workflow source audit #336

on:
  pull_request:
    paths:
      - ".github/workflows/a2-e2-original-exposed-336.yml"
      - ".github/workflows/a2-e2-one-shot-lane-test-336.yml"
      - "tests/test_a2_e2_one_shot_workflow_336.py"
      - "research/a2_e2_failure_manifest_336.py"
      - "research/a2_e2_exposed_activation_336.py"
      - "research/a2_locked_rotate_copy_pilot_336.py"
      - "research/a2_matched_recipient_contract_336.py"
      - "research/a2_passive_native_recipient_observer_336.py"
      - "research/protocols/a2_e2_exposed_rotate_336.json"
      - "research/protocols/a2_rotate_copy_preflight_334.json"

permissions:
  contents: read

jobs:
  static_no_exposed_seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "pypy3.11"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test only source-controlled workflow gates
        run: |
          python -m unittest tests.test_a2_e2_one_shot_workflow_336 -v
