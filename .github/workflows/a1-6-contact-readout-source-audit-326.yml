name: A1.6 source-only native contact-effect design validation

on:
  pull_request:
    paths:
      - "docs/research/a1_6_effective_contact_readout_design_326.json"
      - "docs/research/a1_6_effective_contact_readout_design_326.md"
      - "tests/test_a1_6_effective_contact_readout_design_326.py"
      - ".github/workflows/a1-6-contact-readout-source-audit-326.yml"

permissions:
  contents: read

jobs:
  nonexecuting_contact_support:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "pypy3.11"]
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read-only native operator fixture + future authorization HOLD
        run: |
          python -m unittest tests.test_a1_6_effective_contact_readout_design_326 -v
