name: L3 E0 #363 source-native route — one reviewed marker only

on:
  push:
    branches: [main]
    paths:
      - "research/approvals/l3_route_e0_363.run"

permissions:
  contents: read

concurrency:
  group: l3-route363-original-one-shot
  cancel-in-progress: false

jobs:
  bounded_genuine_native_route_exploratory:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Confirm marker-only source lock and existing nonexecuting source tests
        shell: bash
        env:
          EXACT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "research/approvals/l3_route_e0_363.run"
          test "$(git log --full-history --format=%H --diff-filter=A HEAD -- research/approvals/l3_route_e0_363.run | wc -l)" -eq 1
          test "$(git log --full-history --format=%H --diff-filter=M HEAD -- research/approvals/l3_route_e0_363.run | wc -l)" -eq 0
          test "$(git log --full-history --format=%H --diff-filter=D HEAD -- research/approvals/l3_route_e0_363.run | wc -l)" -eq 0
          python -m unittest tests.test_l3_native_route_363 tests.test_l3_route_preflight_363 tests.test_l3_trace_only_physical_read_363 -v
      - name: Original B/H native contact-stage attribution (once, only this reviewed marker)
        id: native_study
        shell: bash
        env:
          EXACT_SOURCE_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p research/artifacts
          timeout --signal=TERM --kill-after=10s 900s python -m tests.l3_native_route_pilot_363 \
            --source-sha "$EXACT_SOURCE_SHA" --execute \
            --output research/artifacts/l3_route_e0_363_native_bh.json
          sha256sum research/artifacts/l3_route_e0_363_native_bh.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/artifacts/l3_route_e0_363_native_bh.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="UG_L3_363_GENUINE_NATIVE_ROUTE_E0_V1"
          assert r["issue"]==363
          assert r["original_authentic_raw_sha256"]=="f9ff71a0ef14c75fc37f021d29e983efbb1cb4e3b2d7eed6451403462907999f"
          assert set(r["classification"])=={"544","545"}
          assert r["old_source_golden_pass"] is True
          assert r["controls_pass"] is True
          assert r["genuine_native_observed_unobserved_parity"] is True
          assert r["independent_confirmation"] is False
          assert r["learning_claim"] is False
          assert p.stat().st_size<=131072
          for seed in ("544","545"):
              c=r["classification"][seed]
              assert c["scope"]=="SUPPLIED_SOURCE_NATIVE_EVENTS_ONLY_NOT_SELF_AUTHENTICATING"
              assert c["independent_confirmation"] is False
              assert c["learning_claim"] is False
          print("L3_E0_363_CLASSIFICATION:",{k:v["classification"] for k,v in r["classification"].items()})
          print("L3_E0_363_COUNTS:",{k:v["counts"] for k,v in r["classification"].items()})
          PY
          # Artifact retention is short; print byte-exact evidence with SHA for later Git archival.
          echo "L3_E0_363_RAW_B64_BEGIN"
          base64 -w0 research/artifacts/l3_route_e0_363_native_bh.json
          echo
          echo "L3_E0_363_RAW_B64_END"
      - name: Preserve source-native results until lossless Git archival
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l3-route-e0-363-original-native-one-shot-evidence
          path: research/artifacts/l3_route_e0_363_native_bh.json
          if-no-files-found: error
          retention-days: 5
